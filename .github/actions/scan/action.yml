name: Caspian Security Scan
description: Scan a project and publish a readable job summary with optional SARIF upload.
author: CaspianTools
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Workspace directory to scan.
    default: '.'
  output:
    description: Report file path.
    default: caspian-scan.sarif
  format:
    description: 'sarif | json | text'
    default: sarif
  fail-on:
    description: 'error | warning | info | never. Use never for advisory adoption.'
    default: error
  new-only:
    description: Compare findings with the merge base when changed-since is set; added files are fully checked.
    default: 'false'
  strict:
    description: Reject any incomplete coverage, including generated and oversized files.
    default: 'false'
  include:
    description: Comma-separated additional file globs or path fragments.
    default: ''
  exclude:
    description: Comma-separated additional directory basenames to exclude.
    default: 'out,node_modules,.git,coverage,dist,build'
  max-file-size:
    description: Maximum file size in bytes; 0 disables the limit.
    default: '500000'
  baseline:
    description: Optional reviewed baseline file. New baselines use source fingerprints.
    default: ''
  changed-since:
    description: 'Git ref for changed-file scope. Requires checkout fetch-depth: 0. Existing findings within changed files are still reported unless baselined.'
    default: ''
  upload-sarif:
    description: Upload SARIF to Code Scanning. Requires repository support and security-events write permission.
    default: 'true'
outputs:
  sarif-file:
    description: Report file path.
    value: ${{ inputs.output }}
  exit-code:
    description: 'Scanner exit: 0 below threshold, 1 findings, 2 failed or strict incomplete scan.'
    value: ${{ steps.scan.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Caspian dependencies
      shell: bash
      run: |
        CASPIAN_ROOT="$GITHUB_ACTION_PATH/../../.."
        echo "CASPIAN_ROOT=$CASPIAN_ROOT" >> "$GITHUB_ENV"
        npm --prefix "$CASPIAN_ROOT" ci
    - name: Compile Caspian
      shell: bash
      run: npm --prefix "$CASPIAN_ROOT" run compile
    - name: Run Caspian scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_FORMAT: ${{ inputs.format }}
        SCAN_OUTPUT: ${{ inputs.output }}
        SCAN_FAIL_ON: ${{ inputs.fail-on }}
        SCAN_MAX_SIZE: ${{ inputs.max-file-size }}
        SCAN_INCLUDE: ${{ inputs.include }}
        SCAN_EXCLUDE: ${{ inputs.exclude }}
        SCAN_BASELINE: ${{ inputs.baseline }}
        SCAN_BASE: ${{ inputs.changed-since }}
        SCAN_NEW_ONLY: ${{ inputs.new-only }}
        SCAN_STRICT: ${{ inputs.strict }}
      run: |
        : > "$RUNNER_TEMP/caspian-summary.md"
        args=("$SCAN_PATH" --format "$SCAN_FORMAT" --output "$SCAN_OUTPUT"
          --fail-on "$SCAN_FAIL_ON" --max-file-size "$SCAN_MAX_SIZE"
          --summary "$RUNNER_TEMP/caspian-summary.md")
        if [ -n "$SCAN_INCLUDE" ]; then args+=(--include "$SCAN_INCLUDE"); fi
        if [ -n "$SCAN_EXCLUDE" ]; then args+=(--exclude "$SCAN_EXCLUDE"); fi
        if [ -n "$SCAN_BASELINE" ]; then args+=(--baseline "$SCAN_BASELINE"); fi
        if [ -n "$SCAN_BASE" ]; then args+=(--changed-since "$SCAN_BASE"); fi
        if [ "$SCAN_STRICT" = "true" ]; then args+=(--strict); fi
        if [ "$SCAN_NEW_ONLY" = "true" ] && [ -n "$SCAN_BASE" ]; then args+=(--new-only); fi
        scan_exit=0
        node "$CASPIAN_ROOT/out/cli/scan.js" "${args[@]}" || scan_exit=$?
        echo "exit-code=$scan_exit" >> "$GITHUB_OUTPUT"
        if [ -s "$RUNNER_TEMP/caspian-summary.md" ]; then
          cat "$RUNNER_TEMP/caspian-summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo '## Caspian Security: scan failed before producing a report' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload SARIF to Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && inputs.format == 'sarif' && steps.scan.outputs.exit-code != '2' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: caspian-security
    - name: Enforce scan outcome
      if: always()
      shell: bash
      env:
        SCAN_EXIT: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$SCAN_EXIT" in
          0) echo 'Scan completed below the configured threshold. Review the summary for coverage gaps.' ;;
          1) echo 'Findings exceed the configured threshold.'; exit 1 ;;
          *) echo 'Scan failed or coverage was incomplete under strict mode.'; exit 2 ;;
        esac
