name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-compile-test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Windows is in the matrix because the codebase carries explicit
      # Windows path-normalisation logic (baseline, caspianignore, scan
      # walk) that was previously only ever exercised on Linux.
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
        exclude:
          # One Windows leg is enough to catch path-separator regressions.
          - os: windows-latest
            node-version: 18
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test (with coverage gate)
        run: npm run test:coverage

  package:
    runs-on: ubuntu-latest
    needs: lint-compile-test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test installed npm package
        run: npm run test:package

      - name: Package VSIX
        run: npx vsce package --no-git-tag-version
