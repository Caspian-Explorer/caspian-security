name: Publish npm package

# Configure the matching trusted publisher on npmjs.com before running this.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version, without v (for example 10.14.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: caspian-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION)) process.exit(1)'

      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Match the package to the requested release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'if (require("./package.json").version !== process.env.RELEASE_VERSION) process.exit(1)'

      - run: npm ci
      - run: npm run lint
      - run: npm run test:package
      - run: npm run test:coverage

      - name: Publish through npm trusted publishing
        run: npm publish --access public --provenance
